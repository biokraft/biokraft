name: Update GitHub card

on:
  schedule:
    - cron: "0 6 * * 1" # every Monday 06:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-card:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout profile repo
        uses: actions/checkout@v4

      - name: Checkout gitcg
        uses: actions/checkout@v4
        with:
          repository: dougmaitelli/gitcg
          path: gitcg

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install gitcg deps
        working-directory: gitcg
        run: npm install

      - name: Install workflow deps
        working-directory: scripts
        run: npm install playwright vite
        # installs local to scripts/ so it doesn't touch gitcg's lockfile

      - name: Install Chromium
        working-directory: scripts
        run: npx playwright install --with-deps chromium

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Generate card
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITCG_DIR: ${{ github.workspace }}/gitcg
          CARD_OUT: ${{ github.workspace }}/assets/card.gif
        run: node scripts/update-card.mjs

      - name: Commit if changed
        run: |
          if ! git diff --quiet -- assets/card.gif; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add assets/card.gif
            git commit -m "chore: refresh GitHub card"
            git push
          else
            echo "No change in card, skipping commit."
          fi
